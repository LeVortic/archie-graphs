[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archie-graphs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "networkx>=3.4,<4"]

[project.scripts]
archie = "archie.cli:main"

[tool.setuptools]
packages = ["archie", "schemas"]

[tool.setuptools.package-data]
schemas = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
