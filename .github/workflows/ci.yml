name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test from a clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Integration tests fail instead of skipping when the extractor or fixture is missing.
      ARCHIE_REQUIRE_INTEGRATION: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-virtualenv -r requirements-lock.txt
          .venv/bin/python -m pip install --require-virtualenv --no-deps -e .
          .venv/bin/python -m pip check

      - name: Restore extractor packages from the lock file
        run: dotnet restore extractor/ArchiE.Extractor/ArchiE.Extractor.csproj --locked-mode

      - name: Build Roslyn extractor
        run: dotnet build extractor/ArchiE.Extractor/ArchiE.Extractor.csproj --no-restore

      - name: Build C# fixture
        run: dotnet build fixtures/csharp/Fixture.sln

      - name: Run tests
        run: .venv/bin/python -m pytest -q -rs

      - name: Check that the run left no tracked or untracked changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
